dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  flutter_easyloading: ^3.0.5
