name: smle
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Save Local Data & secure it
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Loading Widget
  flutter_easyloading: ^3.0.5
  # Toast Widget
  flutter_styled_toast: ^2.2.1
  fluttertoast:
  top_snackbar_flutter: ^3.1.0
  # Image view & pick
  flutter_svg: ^2.0.7
  image_picker: ^1.0.4
  # Localization
  flutter_phoenix: ^1.1.1
  intl: ^0.20.0
  # Responsive
  # flutter_screenutil: ^5.9.0
  # Text Font Style
  google_fonts: ^6.2.1
  # Navigation
  page_transition: ^2.1.0
  # Api Calling
  freezed_annotation: ^2.4.4
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1
  get_it: ^7.6.7
  # Firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  # Handle Notifications
  flutter_local_notifications: ^17.2.1+1
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.2.0
  flutter_widget_from_html_core: ^0.17.0
  # Sign in with google account
  google_sign_in: ^6.2.2
  # Sign in with apple account
  sign_in_with_apple: ^7.0.1
  # Scan Card
  card_scanner: ^1.0.1
  # year picker
  month_year_picker: ^0.5.0+1
  multiselect: ^0.1.1
  device_preview: ^1.2.0
  flutter_localizations:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^30.1.42
  video_player: ^2.10.0
  chewie: ^1.12.1
  fl_chart: ^0.63.0
  hydrated_bloc: ^9.1.5
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/png/
    - assets/language/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/png/logo final.png"
  adaptive_icon_background: "#2F3645"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/png/logo final.png"
    background_color: "#2F3645"
    theme_color: "#2F3645"
  windows:
    generate: true
    image_path: "assets/images/png/logo final.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/png/logo final.png"
# flutter pub run flutter_launcher_icons